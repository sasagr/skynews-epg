name: Generate Sky News EPG

# Rebuilds skynews.xml from Sky UK's guide on a schedule and commits it when it changes.
on:
  schedule:
    - cron: "5 */4 * * *"   # every 4 hours (UTC)
  workflow_dispatch: {}       # lets you run it manually from the Actions tab
  push:
    branches: [main]
    paths: ["generate.py", ".github/workflows/epg.yml"]

permissions:
  contents: write             # allow the job to commit skynews.xml back to the repo

concurrency:
  group: epg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The script merges into the committed file instead of replacing it: Sky stops answering for
      # a day once it is over, so the only record of the hours already aired is the runs that saw
      # them.
      - name: Generate skynews.xml
        run: python generate.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain skynews.xml)" ]; then
            git add skynews.xml
            git commit -m "Update Sky News EPG ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "skynews.xml unchanged — nothing to commit."
          fi
